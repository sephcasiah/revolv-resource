# sandhydra.conf

# Server Identity
server_name = SandHydra
server_version =

# Logging
# options: quiet, normal, verbose
log_level = verbose
# The path of the main log file
log_file = sh.log
# vhost log file
vhost_log = {vhost}.log

# Runtimes
python2_enabled = true
python3_enabled = true
# leave blank to use system default paths
python2_path = 
python3_path = 

# HTTP / Behavior
max_connections = 128
# Optional: bind to a specific IP (default 0.0.0.0)
listen_address =
listen_port = 8080
default_vhost = default
timeout_request = 15
timeout_response = 30
max_request_size = 50
enable_keepalive = true
max_keepalive_requests = 100
# mime types config
mime_types = mime.types
# If AdvertiseServer if set to false, then no server field would be
# appended to the responses
server_advertise = true

# Optional
# leave blank if using SSL/TLS via vhosts
SSL_path = 
TLS_path = 
vhost_reload_interval = 0
enable_cors = false